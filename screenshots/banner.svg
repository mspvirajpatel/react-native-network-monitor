<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F172A"/>
      <stop offset="50%" style="stop-color:#1E293B"/>
      <stop offset="100%" style="stop-color:#0F172A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#38BDF8"/>
      <stop offset="100%" style="stop-color:#8B5CF6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Grid pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.3"/>
  
  <!-- Decorative circles -->
  <circle cx="100" cy="100" r="200" fill="#38BDF8" opacity="0.05"/>
  <circle cx="1100" cy="530" r="250" fill="#8B5CF6" opacity="0.05"/>
  
  <!-- Main content -->
  <g transform="translate(60, 80)">
    <!-- Logo/N icon -->
    <rect x="0" y="0" width="80" height="80" rx="16" fill="url(#accent)"/>
    <text x="40" y="55" font-family="Arial, sans-serif" font-size="40" font-weight="900" fill="white" text-anchor="middle">N</text>
    
    <!-- Title -->
    <text x="110" y="35" font-family="Arial, sans-serif" font-size="36" font-weight="800" fill="white">
      React Native
    </text>
    <text x="110" y="70" font-family="Arial, sans-serif" font-size="36" font-weight="800" fill="url(#accent)">
      Network Monitor
    </text>
  </g>
  
  <!-- Tagline -->
  <text x="60" y="200" font-family="Arial, sans-serif" font-size="22" fill="#94A3B8" font-weight="400">
    Professional Debug Overlay for React Native Apps
  </text>
  
  <!-- Feature badges -->
  <g transform="translate(60, 250)">
    <!-- Badge 1 -->
    <rect x="0" y="0" width="160" height="45" rx="8" fill="#38BDF8" opacity="0.15" stroke="#38BDF8" stroke-width="1"/>
    <text x="80" y="28" font-family="Arial, sans-serif" font-size="13" fill="#38BDF8" text-anchor="middle" font-weight="600">Network Logging</text>
    
    <!-- Badge 2 -->
    <rect x="175" y="0" width="140" height="45" rx="8" fill="#22C55E" opacity="0.15" stroke="#22C55E" stroke-width="1"/>
    <text x="245" y="28" font-family="Arial, sans-serif" font-size="13" fill="#22C55E" text-anchor="middle" font-weight="600">Performance</text>
    
    <!-- Badge 3 -->
    <rect x="330" y="0" width="130" height="45" rx="8" fill="#A855F7" opacity="0.15" stroke="#A855F7" stroke-width="1"/>
    <text x="395" y="28" font-family="Arial, sans-serif" font-size="13" fill="#A855F7" text-anchor="middle" font-weight="600">WebSocket</text>
    
    <!-- Badge 4 -->
    <rect x="475" y="0" width="160" height="45" rx="8" fill="#F97316" opacity="0.15" stroke="#F97316" stroke-width="1"/>
    <text x="555" y="28" font-family="Arial, sans-serif" font-size="13" fill="#F97316" text-anchor="middle" font-weight="600">Console Logs</text>
    
    <!-- Badge 5 -->
    <rect x="650" y="0" width="140" height="45" rx="8" fill="#EC4899" opacity="0.15" stroke="#EC4899" stroke-width="1"/>
    <text x="720" y="28" font-family="Arial, sans-serif" font-size="13" fill="#EC4899" text-anchor="middle" font-weight="600">State Tracking</text>
    
    <!-- Badge 6 -->
    <rect x="805" y="0" width="180" height="45" rx="8" fill="#06B6D4" opacity="0.15" stroke="#06B6D4" stroke-width="1"/>
    <text x="895" y="28" font-family="Arial, sans-serif" font-size="13" fill="#06B6D4" text-anchor="middle" font-weight="600">Push Notifications</text>
  </g>
  
  <!-- Terminal mockup -->
  <g transform="translate(60, 330)">
    <rect x="0" y="0" width="500" height="220" rx="12" fill="#0D1117" stroke="#30363D" stroke-width="2"/>
    <!-- Title bar -->
    <rect x="0" y="0" width="500" height="32" rx="12" fill="#161B22"/>
    <rect x="0" y="16" width="500" height="16" fill="#161B22"/>
    <circle cx="20" cy="16" r="6" fill="#FF5F56"/>
    <circle cx="40" cy="16" r="6" fill="#FFBD2E"/>
    <circle cx="60" cy="16" r="6" fill="#27C93F"/>
    <text x="250" y="20" font-family="Arial, sans-serif" font-size="11" fill="#8B949E" text-anchor="middle">Debug Monitor</text>
    
    <!-- Code content -->
    <text x="16" y="58" font-family="monospace" font-size="12" fill="#7EE787">import</text>
    <text x="70" y="58" font-family="monospace" font-size="12" fill="#FF7B72">{ DebugTrigger }</text>
    <text x="175" y="58" font-family="monospace" font-size="12" fill="#7EE787">from</text>
    <text x="210" y="58" font-family="monospace" font-size="12" fill="#A5D6FF">'@mspvirajpatel/rn-monitor'</text>
    
    <text x="16" y="82" font-family="monospace" font-size="12" fill="#FF7B72">const</text>
    <text x="55" y="82" font-family="monospace" font-size="12" fill="#79C0FF">App</text>
    <text x="80" y="82" font-family="monospace" font-size="12" fill="#C9D1D9">= () =&gt; (</text>
    
    <text x="16" y="106" font-family="monospace" font-size="12" fill="#C9D1D9">&lt;</text>
    <text x="32" y="106" font-family="monospace" font-size="12" fill="#7EE787">DebugTrigger</text>
    <text x="140" y="106" font-family="monospace" font-size="12" fill="#79C0FF">password</text>
    <text x="210" y="106" font-family="monospace" font-size="12" fill="#C9D1D9">=</text>
    <text x="220" y="106" font-family="monospace" font-size="12" fill="#A5D6FF">"2026"</text>
    <text x="270" y="106" font-family="monospace" font-size="12" fill="#C9D1D9">&gt;</text>
    
    <text x="32" y="130" font-family="monospace" font-size="12" fill="#C9D1D9">&lt;</text>
    <text x="48" y="130" font-family="monospace" font-size="12" fill="#7EE787">HomeScreen</text>
    <text x="136" y="130" font-family="monospace" font-size="12" fill="#C9D1D9">/&gt;</text>
    
    <text x="16" y="154" font-family="monospace" font-size="12" fill="#C9D1D9">&lt;/</text>
    <text x="36" y="154" font-family="monospace" font-size="12" fill="#7EE787">DebugTrigger</text>
    <text x="144" y="154" font-family="monospace" font-size="12" fill="#C9D1D9">&gt;</text>
    
    <text x="16" y="178" font-family="monospace" font-size="12" fill="#C9D1D9">)</text>
  </g>
  
  <!-- Phone mockup -->
  <g transform="translate(620, 330)">
    <rect x="0" y="0" width="280" height="220" rx="16" fill="#1E293B" stroke="#334155" stroke-width="2"/>
    <rect x="8" y="8" width="264" height="204" rx="4" fill="#0F172A"/>
    
    <!-- Status bar -->
    <rect x="8" y="8" width="264" height="24" fill="#1E293B"/>
    <text x="140" y="24" font-family="Arial, sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">9:41</text>
    
    <!-- Network log entries -->
    <rect x="16" y="40" width="248" height="36" rx="6" fill="#1E293B"/>
    <rect x="22" y="48" width="32" height="16" rx="4" fill="#22C55E" opacity="0.2"/>
    <text x="38" y="60" font-family="Arial, sans-serif" font-size="9" fill="#22C55E" text-anchor="middle" font-weight="700">GET</text>
    <text x="62" y="60" font-family="Arial, sans-serif" font-size="9" fill="#94A3B8">/api/users</text>
    <text x="240" y="60" font-family="Arial, sans-serif" font-size="9" fill="#22C55E" text-anchor="end">200</text>
    
    <rect x="16" y="82" width="248" height="36" rx="6" fill="#1E293B"/>
    <rect x="22" y="90" width="32" height="16" rx="4" fill="#38BDF8" opacity="0.2"/>
    <text x="38" y="102" font-family="Arial, sans-serif" font-size="9" fill="#38BDF8" text-anchor="middle" font-weight="700">POST</text>
    <text x="68" y="102" font-family="Arial, sans-serif" font-size="9" fill="#94A3B8">/api/data</text>
    <text x="240" y="102" font-family="Arial, sans-serif" font-size="9" fill="#22C55E" text-anchor="end">201</text>
    
    <rect x="16" y="124" width="248" height="36" rx="6" fill="#1E293B"/>
    <rect x="22" y="132" width="32" height="16" rx="4" fill="#EF4444" opacity="0.2"/>
    <text x="38" y="144" font-family="Arial, sans-serif" font-size="9" fill="#EF4444" text-anchor="middle" font-weight="700">GET</text>
    <text x="62" y="144" font-family="Arial, sans-serif" font-size="9" fill="#94A3B8">/api/fail</text>
    <text x="240" y="144" font-family="Arial, sans-serif" font-size="9" fill="#EF4444" text-anchor="end">500</text>
    
    <rect x="16" y="166" width="248" height="36" rx="6" fill="#1E293B"/>
    <rect x="22" y="174" width="32" height="16" rx="4" fill="#A855F7" opacity="0.2"/>
    <text x="38" y="186" font-family="Arial, sans-serif" font-size="9" fill="#A855F7" text-anchor="middle" font-weight="700">WS</text>
    <text x="62" y="186" font-family="Arial, sans-serif" font-size="9" fill="#94A3B8">Connected</text>
  </g>
  
  <!-- Bottom bar -->
  <rect x="0" y="580" width="1200" height="50" fill="#0F172A"/>
  <text x="60" y="610" font-family="Arial, sans-serif" font-size="14" fill="#64748B">
    npm install @mspvirajpatel/react-native-network-monitor
  </text>
  <text x="1140" y="610" font-family="Arial, sans-serif" font-size="14" fill="#38BDF8" text-anchor="end">
    v0.6.1 • MIT License
  </text>
</svg>